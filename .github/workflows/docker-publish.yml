name: Docker Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build, smoke-test & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q xmltodict
            /tmp/venv/bin/python -m unittest discover -s tests -t . -v
          else
            echo "no tests directory"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: scanner:ci
          cache-from: type=gha

      # Scan a local nginx (ports 80 and 8080) with each of the three scripts
      # and check the records the bridge and the detection rules read.
      - name: Smoke scan against a local nginx
        run: |
          set -euo pipefail
          docker network create --subnet 172.30.99.0/24 smoke
          docker run -d --name web --network smoke nginx:1.27-alpine \
            sh -c "sed -i 's/listen  *80;/listen 80; listen 8080;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
          # one open port only (80)
          docker run -d --name web1 --network smoke nginx:1.27-alpine
          sleep 3
          docker run --rm --network smoke -e TARGET=web scanner:ci | tee port.log
          grep -F "'type': 'nmap', 'scanner': 'nmap_port', 'target': 'web', 'port': '80', 'protocol': 'tcp'" port.log
          grep -F "'scanner': 'nmap_port', 'target': 'web', 'port': '8080', 'protocol': 'tcp'" port.log
          grep -F "'scan': 'done'" port.log
          docker run --rm --network smoke -e TARGET=web scanner:ci python3 /code/nmap_httprecon.py | tee http.log
          grep -F "'type': 'nmap', 'scanner': 'nmap_httpd', 'target': 'web'" http.log
          docker run --rm --network smoke -e TARGET=web scanner:ci python3 /code/nmap_tlscipher.py | tee tls.log
          grep -F "'type': 'nmap', 'scanner': 'nmap_tls', 'target': 'web'" tls.log

      # A host with exactly one open port: xmltodict gives a dict, not a list.
      - name: Smoke scan of a host with one open port
        run: |
          set -euo pipefail
          for script in nmap_portscanner nmap_httprecon nmap_tlscipher; do
            docker run --rm --network smoke -e TARGET=web1 scanner:ci python3 /code/$script.py | tee one-$script.log
            grep -F "'scan': 'done'" one-$script.log
          done
          grep -F "'type': 'nmap', 'scanner': 'nmap_port', 'target': 'web1', 'port': '80', 'protocol': 'tcp'" one-nmap_portscanner.log
          test "$(grep -c "'scanner': 'nmap_port'" one-nmap_portscanner.log)" = 1
          test "$(grep -c "'scanner': 'nmap_httpd'" one-nmap_httprecon.log)" = 1
          test "$(grep -c "'scanner': 'nmap_tls'" one-nmap_tlscipher.log)" = 1

      # An unused address in the smoke network: every script exits 0 with no
      # findings, just the scanner_stop and "scan: done" records.
      - name: Smoke scan of a down host
        run: |
          set -euo pipefail
          for script in nmap_portscanner nmap_httprecon nmap_tlscipher; do
            for mode in SMOKE_MODE=default NMAP_UNPRIVILEGED=1; do
              docker run --rm --network smoke -e TARGET=172.30.99.250 -e $mode scanner:ci python3 /code/$script.py | tee down.log
              grep -F "'scan': 'done'" down.log
              if grep -F "'scanner': 'nmap_" down.log; then echo "unexpected record"; exit 1; fi
            done
          done

      # The operator's default pod: uid 1000, every capability dropped,
      # no privilege escalation, read-only root, NMAP_UNPRIVILEGED=1.
      - name: Smoke scan in unprivileged mode
        run: |
          set -euo pipefail
          mkdir -m 777 out-unpriv
          docker run --rm --network smoke -u 1000 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp -v "$PWD/out-unpriv:/out" \
            -e TARGET=web -e NMAP_UNPRIVILEGED=1 scanner:ci | tee unpriv.log
          grep -F "'scanner': 'nmap_port', 'target': 'web', 'port': '80', 'protocol': 'tcp'" unpriv.log
          grep -F "'scanner': 'nmap_port', 'target': 'web', 'port': '8080', 'protocol': 'tcp'" unpriv.log
          grep -F "'scan': 'done'" unpriv.log
          grep -F 'scaninfo type="connect"' out-unpriv/result.xml
          docker run --rm --network smoke -u 1000 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp -v "$PWD/out-unpriv:/out" \
            -e TARGET=web -e NMAP_UNPRIVILEGED=1 scanner:ci python3 /code/nmap_tlscipher.py | tee unpriv-tls.log
          grep -F "'type': 'nmap', 'scanner': 'nmap_tls', 'target': 'web'" unpriv-tls.log

      # The operator's pod with scanners.nmapRawSockets: uid 1000, every
      # capability dropped but NET_RAW, NMAP_PRIVILEGED=1. nmap runs from the
      # copy with a file capability, without sudo, and does a SYN scan.
      - name: Smoke scan in raw-sockets mode
        run: |
          set -euo pipefail
          mkdir -m 777 out-raw
          raw() {
            docker run --rm --network smoke -u 1000 --cap-drop ALL --cap-add NET_RAW \
              --read-only --tmpfs /tmp -v "$PWD/out-raw:/out" -e NMAP_PRIVILEGED=1 "$@"
          }
          raw -e TARGET=web scanner:ci | tee raw.log
          grep -F "'scanner': 'nmap_port', 'target': 'web', 'port': '80', 'protocol': 'tcp'" raw.log
          grep -F "'scanner': 'nmap_port', 'target': 'web', 'port': '8080', 'protocol': 'tcp'" raw.log
          grep -F "'scan': 'done'" raw.log
          grep -F 'scaninfo type="syn"' out-raw/result.xml
          raw -e TARGET=web1 scanner:ci | tee raw-one.log
          test "$(grep -c "'scanner': 'nmap_port'" raw-one.log)" = 1
          raw -e TARGET=web scanner:ci python3 /code/nmap_tlscipher.py | tee raw-tls.log
          grep -F "'type': 'nmap', 'scanner': 'nmap_tls', 'target': 'web'" raw-tls.log
          raw -e TARGET=172.30.99.250 scanner:ci python3 /code/nmap_tlscipher.py | tee raw-down.log
          grep -F "'scan': 'done'" raw-down.log
          if grep -F "'scanner': 'nmap_" raw-down.log; then echo "unexpected record"; exit 1; fi
          # /bin/nmap itself has no file capability
          test -z "$(docker run --rm --entrypoint getcap scanner:ci /usr/bin/nmap)"
          # File capabilities need privilege escalation allowed: with
          # no-new-privileges the kernel refuses to exec nmap-raw, and the
          # script must fail loudly, not report a clean empty scan.
          rm -f out-raw/result.xml
          rc=0; raw --security-opt no-new-privileges -e TARGET=web scanner:ci > nnp.log 2> nnp.err || rc=$?
          echo "exit $rc"; cat nnp.log nnp.err
          grep -o 'scaninfo type="[a-z]*"' out-raw/result.xml || true
          grep -o '<port [^>]*>' out-raw/result.xml || true
          docker run --rm -u 1000 --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges --entrypoint sh scanner:ci \
            -c 'grep Cap /proc/self/status; /usr/local/lib/samma/nmap-raw --version | head -1; echo rc=$?; grep -i nonewprivs /proc/self/status; uname -r'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
